<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SaaS 运营与 Watchdog 巡检 · Factory AI Native OS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="bar">
      <strong>Factory AI Native OS</strong>
      <a href="/app/">工作台</a>
      <a href="/app/market.html">经营与市场</a>
      <a href="/app/ops.html"><strong>运营总控</strong></a>
      <span id="who" class="muted" style="margin-left:auto"></span>
    </div>
  </header>

  <main style="max-width:1180px;margin:1rem auto;padding:0 1rem">
    <section class="card">
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        <label>管理员 API Key：<input id="apiKey" type="password" placeholder="粘贴 fos_... 密钥" style="width:260px" /></label>
        <button id="btnLoad">刷新运营总览</button>
        <button id="btnWatchdog">立即执行全厂 Watchdog 巡检</button>
        <span id="msg" class="muted"></span>
      </div>
    </section>

    <section class="card">
      <h2>多租户 SaaS 运营总览</h2>
      <div id="saasSummary" class="muted">加载中...</div>
      <table id="tenantTable" style="width:100%;margin-top:.5rem">
        <thead>
          <tr><th>租户 ID</th><th>工厂名称</th><th>行业包</th><th>启用模块数</th><th>活跃用户</th><th>事件总数</th><th>未闭环待办</th><th>待审批</th><th>7日 Token</th><th>安全基线</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>当前租户安全与上线基线自检</h2>
      <table id="secTable" style="width:100%">
        <thead>
          <tr><th>检查项</th><th>结果</th><th>级别</th><th>详情</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="ops.js"></script>
</body>
</html>
