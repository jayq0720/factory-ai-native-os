<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>筑炉施工与烘炉验收 · Factory AI Native OS</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header>
    <div class="bar">
      <strong>Factory AI Native OS</strong>
      <a href="/app/">工作台</a>
      <a href="/app/eam.html">设备管理</a>
      <a href="/app/ehs.html">安全环保</a>
      <a href="/app/hr.html">人力薪酬</a>
      <a href="/app/rnd.html">研发配方</a>
      <a href="/app/construction.html"><strong>筑炉施工</strong></a>
      <span id="who" class="muted"></span>
    </div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>筑炉施工与烘炉验收</h1>
        <p>耐材筑炉施工项目进度、每日施工安全日报与烘炉升温速率红线监测。</p>
      </div>
    </div>

    <section class="card toolbar-card">
      <div class="toolbar">
        <div class="toolbar-group">
          <label class="toolbar-field">API Key
            <input id="apiKey" type="password" placeholder="粘贴 fos_... 密钥" />
          </label>
          <button id="btnLoad" class="btn primary">刷新看板</button>
        </div>
        <div class="toolbar-group">
          <button id="btnExport" class="btn small">导出施工与烘炉报表 (.xlsx)</button>
        </div>
        <span id="msg" class="muted toolbar-msg"></span>
      </div>
    </section>

    <section class="card">
      <h2>筑炉施工项目台账</h2>
      <div id="siteSummary" class="summary-strip">加载中...</div>
      <table id="siteTable">
        <thead>
          <tr><th>项目号</th><th>工程名称</th><th>客户</th><th>炉型</th><th>负责人</th><th>计划吨</th><th>完成吨</th><th>进度%</th><th>状态</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <div class="grid-2">
      <section class="card">
        <h2>每日施工日报</h2>
        <table id="logTable">
          <thead>
            <tr><th>日报号</th><th>工程名称</th><th>日期</th><th>人数</th><th>当日吨位</th><th>安全</th><th>施工内容</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="card">
        <h2>烘炉升温监测（温差/速率红线自动告警）</h2>
        <table id="dryTable">
          <thead>
            <tr><th>记录号</th><th>工程名称</th><th>阶段</th><th>目标℃</th><th>实测℃</th><th>速率℃/h</th><th>判定</th><th>测温时间</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
  </main>
  <script src="construction.js"></script>
  <script src="shell.js" defer></script>
</body>
</html>
