<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>筑炉施工与烘炉验收 · Factory AI Native OS</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header>
    <div class="bar">
      <strong>Factory AI Native OS</strong>
      <a href="/app/">工作台</a>
      <a href="/app/eam.html">设备管理</a>
      <a href="/app/ehs.html">安全环保</a>
      <a href="/app/hr.html">人力薪酬</a>
      <a href="/app/rnd.html">研发配方</a>
      <a href="/app/construction.html"><strong>筑炉施工</strong></a>
      <span id="who" class="muted" style="margin-left:auto"></span>
    </div>
  </header>

  <main style="max-width:1180px;margin:1rem auto;padding:0 1rem">
    <section class="card">
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        <label>API Key：<input id="apiKey" type="password" placeholder="粘贴 fos_... 密钥" style="width:260px" /></label>
        <button id="btnLoad">刷新看板</button>
        <button id="btnExport">导出施工与烘炉报表 (.xlsx)</button>
        <span id="msg" class="muted"></span>
      </div>
    </section>

    <section class="card">
      <h2>筑炉施工项目台账</h2>
      <div id="siteSummary" class="muted">加载中...</div>
      <table id="siteTable" style="width:100%;margin-top:.5rem">
        <thead>
          <tr><th>项目号</th><th>工程名称</th><th>客户</th><th>炉型</th><th>负责人</th><th>计划吨</th><th>完成吨</th><th>进度%</th><th>状态</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>每日施工日报</h2>
      <table id="logTable" style="width:100%">
        <thead>
          <tr><th>日报号</th><th>工程名称</th><th>日期</th><th>人数</th><th>当日吨位</th><th>安全</th><th>施工内容</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>烘炉升温监测（温差/速率红线自动告警）</h2>
      <table id="dryTable" style="width:100%">
        <thead>
          <tr><th>记录号</th><th>工程名称</th><th>阶段</th><th>目标℃</th><th>实测℃</th><th>速率℃/h</th><th>判定</th><th>测温时间</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="construction.js"></script>
<script src="shell.js" defer></script>
</body>
</html>
