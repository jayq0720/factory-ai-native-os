<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人力排班与薪酬 · Factory AI Native OS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="bar">
      <strong>Factory AI Native OS</strong>
      <a href="/app/">工作台</a>
      <a href="/app/quality.html">质量体系</a>
      <a href="/app/finance.html">财务成本</a>
      <a href="/app/eam.html">设备管理</a>
      <a href="/app/ehs.html">安全环保</a>
      <a href="/app/hr.html"><strong>人力薪酬</strong></a>
      <span id="who" class="muted" style="margin-left:auto"></span>
    </div>
  </header>

  <main style="max-width:1180px;margin:1rem auto;padding:0 1rem">
    <section class="card">
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        <label>API Key：<input id="apiKey" type="password" placeholder="粘贴 fos_... 密钥" style="width:260px" /></label>
        <label>月份：<input id="month" type="month" /></label>
        <button id="btnLoad">刷新看板</button>
        <button id="btnRemind">生成证照到期提醒</button>
        <button id="btnExport">导出人力与薪酬报表 (.xlsx)</button>
        <span id="msg" class="muted"></span>
      </div>
    </section>

    <section class="card">
      <h2>月度计件薪酬汇总</h2>
      <div id="paySummary" class="muted">加载中...</div>
      <table id="payTable" style="width:100%;margin-top:.5rem">
        <thead>
          <tr><th>工号</th><th>姓名</th><th>部门</th><th>出勤天</th><th>加班(h)</th><th>计件量</th><th>基本折算</th><th>加班费</th><th>计件工资</th><th>应发合计</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>特种作业资质与复审预警</h2>
      <table id="certTable" style="width:100%">
        <thead>
          <tr><th>证书号</th><th>员工</th><th>资质类型</th><th>发证日</th><th>到期日</th><th>状态</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>员工花名册</h2>
      <table id="empTable" style="width:100%">
        <thead>
          <tr><th>工号</th><th>姓名</th><th>部门</th><th>岗位</th><th>班组</th><th>月基本工资</th><th>状态</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>排班考勤与计件记录</h2>
      <table id="rstTable" style="width:100%">
        <thead>
          <tr><th>日期</th><th>班次</th><th>员工</th><th>出勤</th><th>工时</th><th>加班</th><th>计件量</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="hr.js"></script>
</body>
</html>
