<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人力排班与薪酬 · Factory AI Native OS</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header>
    <div class="bar">
      <strong>Factory AI Native OS</strong>
      <a href="/app/">工作台</a>
      <a href="/app/quality.html">质量体系</a>
      <a href="/app/finance.html">财务成本</a>
      <a href="/app/eam.html">设备管理</a>
      <a href="/app/ehs.html">安全环保</a>
      <a href="/app/hr.html"><strong>人力薪酬</strong></a>
      <span id="who" class="muted"></span>
    </div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>人力排班与计件薪酬</h1>
        <p>月度计件薪酬汇总、特种作业资质复审预警、班组花名册与每日排班考勤记录。</p>
      </div>
    </div>

    <section class="card toolbar-card">
      <div class="toolbar">
        <div class="toolbar-group">
          <label class="toolbar-field">API Key
            <input id="apiKey" type="password" placeholder="粘贴 fos_... 密钥" />
          </label>
          <label class="toolbar-field">月份
            <input id="month" type="month" />
          </label>
          <button id="btnLoad" class="btn primary">刷新看板</button>
        </div>
        <div class="toolbar-group">
          <button id="btnRemind" class="btn small">生成证照到期提醒</button>
          <button id="btnExport" class="btn small">导出薪酬报表 (.xlsx)</button>
        </div>
        <span id="msg" class="muted toolbar-msg"></span>
      </div>
    </section>

    <section class="card">
      <h2>月度计件薪酬汇总</h2>
      <div id="paySummary" class="summary-strip">加载中...</div>
      <table id="payTable">
        <thead>
          <tr><th>工号</th><th>姓名</th><th>部门</th><th>出勤天</th><th>加班(h)</th><th>计件量</th><th>基本折算</th><th>加班费</th><th>计件工资</th><th>应发合计</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <div class="grid-2">
      <section class="card">
        <h2>特种作业资质与复审预警</h2>
        <table id="certTable">
          <thead>
            <tr><th>证书号</th><th>员工</th><th>资质类型</th><th>发证日</th><th>到期日</th><th>状态</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="card">
        <h2>排班考勤与计件记录</h2>
        <table id="rstTable">
          <thead>
            <tr><th>日期</th><th>班次</th><th>员工</th><th>出勤</th><th>工时</th><th>加班</th><th>计件量</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </div>

    <section class="card">
      <h2>员工花名册</h2>
      <table id="empTable">
        <thead>
          <tr><th>工号</th><th>姓名</th><th>部门</th><th>岗位</th><th>班组</th><th>月基本工资</th><th>状态</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="hr.js"></script>
  <script src="shell.js" defer></script>
</body>
</html>
