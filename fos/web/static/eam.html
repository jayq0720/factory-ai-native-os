<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设备管理 EAM · Factory AI Native OS</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header>
    <div class="bar">
      <strong>Factory AI Native OS</strong>
      <a href="/app/">工作台</a>
      <a href="/app/kiln.html">窑炉监控</a>
      <a href="/app/quality.html">质量体系</a>
      <a href="/app/finance.html">财务成本</a>
      <a href="/app/eam.html"><strong>设备管理</strong></a>
      <span id="who" class="muted"></span>
    </div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>设备管理与预防性维护（EAM）</h1>
        <p>设备可靠性指标、预防性保养计划、维修工单闭环与备品备件安全库存预警。</p>
      </div>
    </div>

    <section class="card toolbar-card">
      <div class="toolbar">
        <div class="toolbar-group">
          <label class="toolbar-field">API Key
            <input id="apiKey" type="password" placeholder="粘贴 fos_... 密钥" />
          </label>
          <button id="btnLoad" class="btn primary">刷新看板</button>
        </div>
        <div class="toolbar-group">
          <button id="btnRemind" class="btn small">生成保养到期提醒</button>
          <button id="btnExport" class="btn small">导出设备报表 (.xlsx)</button>
        </div>
        <span id="msg" class="muted toolbar-msg"></span>
      </div>
    </section>

    <section class="card">
      <h2>可靠性指标（近 30 天）</h2>
      <div id="relSummary" class="summary-strip">加载中...</div>
    </section>

    <section class="card">
      <h2>设备台账</h2>
      <div id="eqSummary" class="summary-strip">加载中...</div>
      <table id="eqTable">
        <thead>
          <tr><th>编码</th><th>名称</th><th>类别</th><th>型号</th><th>位置</th><th>等级</th><th>状态</th><th>下次保养</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <div class="grid-2">
      <section class="card">
        <h2>预防性保养计划（PM）</h2>
        <table id="pmTable">
          <thead>
            <tr><th>计划号</th><th>设备</th><th>保养项目</th><th>周期(天)</th><th>上次完成</th><th>下次到期</th><th>状态</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="card">
        <h2>备品备件库存</h2>
        <table id="spTable">
          <thead>
            <tr><th>编号</th><th>备件名称</th><th>规格</th><th>现存</th><th>安全库存</th><th>预警</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </div>

    <section class="card">
      <h2>维修与保养工单</h2>
      <table id="woTable">
        <thead>
          <tr><th>工单号</th><th>设备</th><th>类型</th><th>优先级</th><th>状态</th><th>停机(分)</th><th>现象/任务</th><th>处理措施</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="eam.js"></script>
  <script src="shell.js" defer></script>
</body>
</html>
