<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EHS 安全环保 · Factory AI Native OS</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header>
    <div class="bar">
      <strong>Factory AI Native OS</strong>
      <a href="/app/">工作台</a>
      <a href="/app/kiln.html">窑炉监控</a>
      <a href="/app/quality.html">质量体系</a>
      <a href="/app/finance.html">财务成本</a>
      <a href="/app/eam.html">设备管理</a>
      <a href="/app/ehs.html"><strong>安全环保</strong></a>
      <span id="who" class="muted"></span>
    </div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>EHS 安全环保合规中心</h1>
        <p>安全隐患排查闭环、特种作业票审批、环保排放监测达标判定与事故险情台账。</p>
      </div>
    </div>

    <section class="card toolbar-card">
      <div class="toolbar">
        <div class="toolbar-group">
          <label class="toolbar-field">API Key
            <input id="apiKey" type="password" placeholder="粘贴 fos_... 密钥" />
          </label>
          <button id="btnLoad" class="btn primary">刷新看板</button>
        </div>
        <div class="toolbar-group">
          <button id="btnRemind" class="btn small">生成隐患超期提醒</button>
          <button id="btnExport" class="btn small">导出 EHS 报告 (.xlsx)</button>
        </div>
        <span id="msg" class="muted toolbar-msg"></span>
      </div>
    </section>

    <section class="card">
      <h2>EHS 合规总览</h2>
      <div id="kpiSummary" class="summary-strip">加载中...</div>
    </section>

    <section class="card">
      <h2>安全隐患排查台账</h2>
      <table id="hzTable">
        <thead>
          <tr><th>编号</th><th>位置</th><th>类别</th><th>等级</th><th>状态</th><th>整改期限</th><th>描述</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>特种作业票（动火/受限空间需总经理审批）</h2>
      <table id="ptTable">
        <thead>
          <tr><th>票号</th><th>类型</th><th>地点</th><th>负责人</th><th>状态</th><th>有效起时</th><th>有效止时</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <div class="grid-2">
      <section class="card">
        <h2>环保排放监测</h2>
        <table id="envTable">
          <thead>
            <tr><th>监测点位</th><th>指标</th><th>实测值</th><th>限值</th><th>单位</th><th>判定</th><th>监测时间</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="card">
        <h2>安全事故与险情</h2>
        <table id="incTable">
          <thead>
            <tr><th>编号</th><th>类型</th><th>地点</th><th>受伤人数</th><th>状态</th><th>经过描述</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
  </main>
  <script src="ehs.js"></script>
  <script src="shell.js" defer></script>
</body>
</html>
