# 全云形态的最小部署：ECS + Docker Compose（方案 7.1）。
# 生产数据库用 RDS PostgreSQL 时，去掉 db 服务并把 FOS_DATABASE_URL 指向 RDS。
name: fos

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fos
      POSTGRES_DB: fos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 设置}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fos -d fos"]
      interval: 5s
      retries: 10

  litellm:
    # 首次部署跑通后，把 main-stable 换成当时的具体版本号再固定
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?请在 deploy/.env 设置}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      FOS_DATABASE_URL: postgresql+asyncpg://fos:${POSTGRES_PASSWORD}@db:5432/fos
      FOS_LLM_MODE: ${FOS_LLM_MODE:-mock}
      FOS_LITELLM_BASE_URL: http://litellm:4000
      FOS_LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      # 文档解析：mock 或 xiaomi（Xiaomi-OCR-0 部署在 PAI-EAS / GPU ECS 上的 vLLM）
      FOS_OCR_MODE: ${FOS_OCR_MODE:-mock}
      FOS_OCR_BASE_URL: ${FOS_OCR_BASE_URL:-http://ocr:8001/v1}
      FOS_OCR_API_KEY: ${FOS_OCR_API_KEY:-}
      # 发卡片（POST /v1/cards）也要用钉钉应用凭据
      FOS_DINGTALK_LUNENG_CLIENT_ID: ${FOS_DINGTALK_LUNENG_CLIENT_ID:-}
      FOS_DINGTALK_LUNENG_CLIENT_SECRET: ${FOS_DINGTALK_LUNENG_CLIENT_SECRET:-}
      FOS_DINGTALK_LUNENG_ROBOT_CODE: ${FOS_DINGTALK_LUNENG_ROBOT_CODE:-}
      FOS_DINGTALK_LUNENG_CARD_TEMPLATE_ID: ${FOS_DINGTALK_LUNENG_CARD_TEMPLATE_ID:-}
    volumes:
      - blobs:/data/blobs   # 生产换 OSS
    ports:
      - "8000:8000"

  # IM 长连接（钉钉 Stream 不需要公网回调地址）。凭据只从 .env / KMS 注入。
  channels:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["fos", "channels", "run"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FOS_DATABASE_URL: postgresql+asyncpg://fos:${POSTGRES_PASSWORD}@db:5432/fos
      FOS_OCR_MODE: ${FOS_OCR_MODE:-mock}
      FOS_OCR_BASE_URL: ${FOS_OCR_BASE_URL:-http://ocr:8001/v1}
      FOS_OCR_API_KEY: ${FOS_OCR_API_KEY:-}
      FOS_DINGTALK_LUNENG_CLIENT_ID: ${FOS_DINGTALK_LUNENG_CLIENT_ID:-}
      FOS_DINGTALK_LUNENG_CLIENT_SECRET: ${FOS_DINGTALK_LUNENG_CLIENT_SECRET:-}
      FOS_DINGTALK_LUNENG_ROBOT_CODE: ${FOS_DINGTALK_LUNENG_ROBOT_CODE:-}
      FOS_DINGTALK_LUNENG_CARD_TEMPLATE_ID: ${FOS_DINGTALK_LUNENG_CARD_TEMPLATE_ID:-}
    volumes:
      - blobs:/data/blobs

volumes:
  pgdata:
  blobs:
