# Factory AI Native OS 生产 Prometheus 抓取配置
# 使用前请将平台超级管理员 API Key 写入受限文件 /etc/prometheus/secrets/fos_ops_token（chmod 600）
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: "fos-api"
    metrics_path: /v1/ops/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/fos_ops_token
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "factory-ai-native-os"
