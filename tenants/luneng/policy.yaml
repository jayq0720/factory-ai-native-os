# 六安绿能（试点）审批规则。只放规则，不放密钥。说明见 docs/policy-and-inbox.md。
#
# 规则作用在事件账本上：命中 effect=approve 的事件不会直接入账，而是生成审批单，
# 按 steps 逐级审批（每级任一合格的人同意即可），全部同意后以申请人身份记账；
# 命中 effect=deny 的事件直接拒绝（红线）。阈值、审批人等以试点现场确认为准（方案 12 章）。
#
# 条件字段取值：事件里有就用事件里的值（变更后的值），否则用对象当前状态。
# 运算：gt gte lt lte eq ne in not_in exists

rules:
  purchase_order_large:
    name: 采购单金额超过 5 万元需总经理审批
    events: [purchase.order_created]
    when:
      - {field: amount, op: gt, value: 50000}
    steps:
      - {name: 总经理审批, role: gm}

  # 合同评审：大额在登记合同时审批一次；合同拆出的订单行不再重复审批（只管没有合同的散单）
  contract_large:
    name: 合同金额 50 万元及以上需销售负责人和总经理审批
    events: [sales.contract_signed, sales.contract_signed_from_quote]
    when:
      - {field: amount, op: gte, value: 500000}
    steps:
      - {name: 销售负责人审批, role: sales_lead}
      - {name: 总经理审批, role: gm}

  sales_order_large:
    name: 无合同订单金额 50 万元及以上需销售负责人和总经理审批
    events: [sales.order_created]
    when:
      - {field: amount, op: gte, value: 500000}
      - {field: contract, op: exists, value: false}
    steps:
      - {name: 销售负责人审批, role: sales_lead}
      - {name: 总经理审批, role: gm}

  order_rescheduled:
    name: 订单交期变更需销售负责人确认
    events: [sales.order_rescheduled]
    steps:
      - {name: 销售负责人确认, role: sales_lead}

  lot_concession:
    name: 来料让步接收需总经理审批
    events: [quality.lot_dispositioned]
    when:
      - {field: status, op: eq, value: concession}
    steps:
      - {name: 总经理审批, role: gm}
    expires_hours: 48

  # ---------- 工程报价（方案 4.2 第 8 步：报价需销售负责人二次确认）----------
  # 毛利率 = (材料净价 - 材料成本) / 材料净价，由报价代码确定性计算后写在事件里。
  # 15% 与“低于成本不能报价”都是占位值，待试点确认。
  eng_quote_confirm:
    name: 工程报价需销售负责人确认
    events: [eng.quote_issued]
    steps:
      - {name: 销售负责人确认, role: sales_lead}

  eng_quote_low_margin:
    name: 材料毛利率低于 15% 加总经理审批
    events: [eng.quote_issued]
    when:
      - {field: gross_margin_pct, op: lt, value: 15}
    steps:
      - {name: 总经理审批, role: gm}

  eng_quote_below_cost:
    name: 报价低于材料成本不能发布
    events: [eng.quote_issued]
    effect: deny
    reason: 报价低于材料成本，请调整折扣或价格
    when:
      - {field: gross_margin_pct, op: lt, value: 0}
