name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fos
          POSTGRES_PASSWORD: fos
          POSTGRES_DB: fos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fos" --health-interval 5s --health-retries 10
    env:
      FOS_DATABASE_URL: postgresql+asyncpg://fos:fos@localhost:5432/fos
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - run: .venv/bin/pytest -q
      - name: 迁移在 PostgreSQL 上可升可降，且与模型一致
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
          .venv/bin/alembic downgrade base
      - run: .venv/bin/fos tenants

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p fos-edge -- --check crates/fos-edge/edge.example.toml
