<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>六安绿能工厂 OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 左侧导航 + 主工作区；顶部固定"模拟数据"横幅；工程模块为五步流水线 */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EBEFF4; --line:#D7DDE6;
  --fg:#17202B; --muted:#5A6576; --accent:#1F5FBF; --accent-soft:#E2EBF9; --on-accent:#FFFFFF;
  --heat:#D9480F; --heat-soft:#FDEBE1; --ok:#2B7A4B; --ok-soft:#E3F3E8; --warn:#A8670A; --warn-soft:#FBF0DA;
  --bad:#C12F2F; --bad-soft:#FBE4E4; --mock:#8A5A00; --mock-bg:#FFF4D6; --paper:#FFFFFF; --paper-fg:#222;
  --hl:#FFE58A; --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 16px rgba(20,30,45,.05);
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --surface-2:#1D2633; --line:#2B3645;
  --fg:#E5EAF1; --muted:#98A4B5; --accent:#6EA2F0; --accent-soft:#1B2C47; --on-accent:#0E131A;
  --heat:#FF7A45; --heat-soft:#3A1F14; --ok:#5BC48A; --ok-soft:#173022; --warn:#E3B04F; --warn-soft:#352812;
  --bad:#F07171; --bad-soft:#3A1A1C; --mock:#F2C14E; --mock-bg:#2E2412; --paper:#1F2731; --paper-fg:#E2E6EC;
  --hl:#6B5A12; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --surface-2:#1D2633; --line:#2B3645;
  --fg:#E5EAF1; --muted:#98A4B5; --accent:#6EA2F0; --accent-soft:#1B2C47; --on-accent:#0E131A;
  --heat:#FF7A45; --heat-soft:#3A1F14; --ok:#5BC48A; --ok-soft:#173022; --warn:#E3B04F; --warn-soft:#352812;
  --bad:#F07171; --bad-soft:#3A1A1C; --mock:#F2C14E; --mock-bg:#2E2412; --paper:#1F2731; --paper-fg:#E2E6EC;
  --hl:#6B5A12; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--mock-bg)}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.mockbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--mock-bg);color:var(--mock);border-bottom:1px solid var(--line);
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.mockbar b{font-weight:700}
.mockbar .sp{flex:1}
.mockbar .tenant{font-family:var(--f-mono);font-size:12px;opacity:.9}

.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100% - 36px)}
nav.side{border-right:1px solid var(--line);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:36px;align-self:start;height:calc(100vh - 36px)}
.brand{padding:4px 10px 16px;display:flex;flex-direction:column;gap:2px}
.brand .t{font-weight:700;font-size:16px}
.brand .s{font-size:12px;color:var(--muted)}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:6px;color:var(--fg)}
.navbtn:hover{background:var(--surface-2)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.navbtn .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:18px}
.navbtn[aria-current="page"] .k{color:var(--accent)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}

main{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.head .sub{color:var(--muted);margin-top:4px;max-width:70ch}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;font-size:13px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap;line-height:1.6}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--accent-soft);color:var(--accent)}
.p-mute{background:var(--surface-2);color:var(--muted)}
.p-mock{background:var(--mock-bg);color:var(--mock);border-color:currentColor;font-size:11px;padding:0 6px}
.p-heat{background:var(--heat-soft);color:var(--heat)}

.stat{display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.stat .v{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.stat .d{font-size:12px}

.talk{border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.talk summary{cursor:pointer;padding:10px 14px;font-size:13px;color:var(--muted);list-style:none;display:flex;gap:8px;align-items:center}
.talk summary::-webkit-details-marker{display:none}
.talk summary::before{content:"▸";font-size:11px}
.talk[open] summary::before{content:"▾"}
.talk ol{margin:0;padding:0 14px 12px 34px;display:flex;flex-direction:column;gap:4px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;background:var(--surface-2);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-soft)}
tfoot td{font-weight:700;border-bottom:0}

/* 总览 */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.agent{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.agent .n{font-weight:500}
.agent .x{font-size:12px;color:var(--muted)}
.agent .c{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.ledger{display:flex;flex-direction:column;max-height:420px;overflow:auto}
.ev{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13px}
.ev .tm{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ev .who{color:var(--muted);font-size:12px}
.ev.new{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.chain{display:flex;gap:0;overflow-x:auto;padding:14px 16px 16px}
.chain .st{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;min-width:118px;padding-right:22px;position:relative}
.chain .st::after{content:"";position:absolute;top:9px;right:4px;width:14px;height:2px;background:var(--line)}
.chain .st:last-child::after{display:none}
.chain .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-family:var(--f-mono);border:2px solid var(--line);background:var(--surface)}
.chain .st.done .dot{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.chain .st.now .dot{border-color:var(--accent);color:var(--accent)}
.chain .st .a{font-size:13px;font-weight:500}
.chain .st .b{font-size:12px;color:var(--muted)}
.inbox-item{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line)}
.inbox-item:last-child{border-bottom:0}
.inbox-item .tx{min-width:0}
.inbox-item .tx .t{font-weight:500}

/* IM */
.im{display:flex;flex-direction:column;height:560px}
.im-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.im-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.msg{display:flex;gap:8px;max-width:92%}
.msg .av{flex:0 0 30px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.msg.bot .av{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--accent-soft);border-color:transparent}
.msg .nm{font-size:11px;color:var(--muted);margin-bottom:2px}
.photo{width:220px;max-width:100%;aspect-ratio:4/3;border-radius:6px;background:linear-gradient(160deg,#e9e3d3,#d7cfba);color:#3b3426;padding:10px 12px;font-size:11px;line-height:1.5;transform:rotate(-1.2deg);font-family:"Noto Sans SC",cursive;box-shadow:inset 0 0 30px rgba(0,0,0,.12)}
.photo b{font-size:12px}
.photo .hw{font-family:var(--f-mono);color:#1d3a8a}
.cardmsg{display:flex;flex-direction:column;gap:6px;min-width:240px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono)}
.im-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.im-in input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;font:inherit;color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.typing{font-size:12px;color:var(--muted)}

/* 工程 */
.stepper{display:flex;gap:0;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.step{flex:1 0 140px;border:0;background:transparent;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:1px;border-right:1px solid var(--line);position:relative}
.step:last-child{border-right:0}
.step .i{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.step .t{font-weight:500}
.step .s{font-size:12px;color:var(--muted)}
.step[aria-current="step"]{background:var(--accent-soft)}
.step[aria-current="step"] .t,.step[aria-current="step"] .i{color:var(--accent)}
.step.done .i::after{content:" ✓";color:var(--ok)}
.docview{height:640px;overflow:auto;background:var(--surface-2);padding:16px;display:flex;flex-direction:column;gap:16px;border-radius:0 0 var(--r) var(--r)}
.page{background:var(--paper);color:var(--paper-fg);border:1px solid var(--line);border-radius:2px;padding:28px 30px 34px;position:relative;font-size:13px;line-height:1.85;box-shadow:var(--shadow)}
.page .pno{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.page .how{position:absolute;top:8px;right:10px}
.page h4{font-size:14px;margin:10px 0 4px}
.page .ttl{font-size:18px;text-align:center;font-weight:700;margin:40px 0 18px;line-height:1.5}
.page table{font-size:12px;margin:6px 0}
.page th{background:transparent;color:inherit;border:1px solid var(--line)}
.page td{border:1px solid var(--line)}
.page.scanned{background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(128,128,128,.035) 3px 4px)}
.page.parsing::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--accent-soft) 50%,transparent);background-size:100% 40%;background-repeat:no-repeat;animation:scan 1s linear infinite;opacity:.8}
@keyframes scan{from{background-position:0 -40%}to{background-position:0 140%}}
.page.pending{opacity:.45}
mark.src{background:transparent;border-radius:2px;transition:background .3s}
mark.src.hot{background:var(--hl);color:inherit;box-shadow:0 0 0 2px var(--hl)}
mark.src.seen{border-bottom:1.5px dotted var(--accent);background:transparent;color:inherit}
.fields td .cite{font-family:var(--f-mono);font-size:11px;color:var(--accent);white-space:nowrap}
.fields input{width:100%;min-width:90px;border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 4px;font:inherit;color:inherit}
.fields input:hover{border-color:var(--line)}
.fields input:focus{border-color:var(--accent);background:var(--surface)}
.fields .grp td{background:var(--surface-2);font-size:12px;font-weight:500;color:var(--muted);padding:5px 10px}
.progress{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.opt{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.layers{display:flex;flex-direction:column;gap:4px}
.layer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:12px;padding:5px 8px;border-radius:4px;background:var(--surface-2);align-items:center}
.layer .bar{height:6px;border-radius:3px}
.metric{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.metric .num{font-weight:600}
.wall{width:100%;height:auto;display:block}
.thick{display:grid;grid-template-columns:minmax(0,1fr) 110px 60px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.thick input[type=range]{width:100%}
.thick:last-child{border-bottom:0}
.editor{padding:20px 24px;line-height:1.9;min-height:300px;outline:none}
.editor h3{margin:14px 0 4px}
.editor p{margin:4px 0}
.cell-in{width:72px;border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:2px 6px;font:inherit;font-family:var(--f-mono);color:var(--fg);text-align:right}
.risk{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:12px 16px 12px 0;border-bottom:1px solid var(--line);align-items:start}
.risk .sv{align-self:stretch;border-radius:0 2px 2px 0}
.risk .sv.bad{background:var(--bad)}.risk .sv.warn{background:var(--warn)}.risk .sv.info{background:var(--accent)}
.risk .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.risk.handled{opacity:.6}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:13px;max-width:min(420px,calc(100vw - 32px));box-shadow:var(--shadow)}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-width:520px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px}

/* 招标 */
.countdown{font-family:var(--f-mono);font-size:28px;font-weight:600;color:var(--heat)}
.star{color:var(--bad);font-weight:700}

/* 窑炉 */
.kiln{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left}
.kiln.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.chart{width:100%;height:auto;display:block}
.trace{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.tnode{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);min-width:150px;flex:1 1 150px;display:flex;flex-direction:column;gap:2px}
.tnode .k{font-size:11px;color:var(--muted)}
.tnode .v{font-weight:500;font-family:var(--f-mono);font-size:13px}
.tnode .e{font-size:12px;color:var(--accent)}

@media (max-width:1000px){.split,.g3{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .mockbar{position:static}.mockbar .tenant,.mockbar .sp{display:none}
  body::before{display:none}
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);gap:2px}
  .brand,.side .foot{display:none}
  .navbtn{width:auto;white-space:nowrap}
  .g2{grid-template-columns:minmax(0,1fr)}
  .docview{height:480px}
  .im{height:520px}
  .thick{grid-template-columns:minmax(0,1fr) 90px 52px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="mockbar" role="status">
  <b>演示模式</b><span>模拟数据，非真实识别结果。文件解析使用预置样例（Xiaomi-OCR-0 mock），客户与项目均为示例。</span>
  <span class="sp"></span><span class="tenant">tenant: lu-an-lvneng · industry-pack: refractory v0.1 · data_mode: mock</span>
</div>
<div class="shell">
  <nav class="side" aria-label="主导航">
    <div class="brand"><span class="t">工厂 AI OS</span><span class="s">六安绿能 · 隔热耐火材料</span></div>
    <button class="navbtn" data-go="overview"><span class="k">01</span>工厂总览</button>

/* ---------------- 确定性计算：多层平壁一维稳态传热 ---------------- */
function hOut(Ts,Ta){const d=Math.max(Ts-Ta,0.01);const hc=1.31*Math.cbrt(d);const e=0.8,s=5.67e-8;const hr=e*s*((Ts+273.15)**4-(Ta+273.15)**4)/d;return hc+hr}
function heat(layers,Tin,Ta){
  let lo=0,hi=20000,res=null;
  for(let i=0;i<80;i++){
    const q=(lo+hi)/2;let T=Tin,ok=true;const temps=[Tin];
    for(const [pk,t] of layers){const P=PRODUCTS[pk],tm=t/1000;let T2;
      if(P.b===0)T2=T-q*tm/P.a;else{const c=P.a*T+P.b/2*T*T-q*tm;const disc=P.a*P.a+2*P.b*c;if(disc<0){ok=false;break}T2=(-P.a+Math.sqrt(disc))/P.b}
      temps.push(T2);T=T2}
    if(!ok||T<Ta){hi=q;continue}
    const qo=hOut(T,Ta)*(T-Ta);res={q,temps,Ts:T};if(qo>q)lo=q;else hi=q}
  return res}
function evalOption(layers){

  const bom=[];let mat=0,tons=0;
  layers.forEach(([pk,t],i)=>{const P=PRODUCTS[pk];const vol=area*t/1000*(1+P.loss);const w=vol*P.rho;const cost=w*P.price;
    let cnt,cu;if(P.form==="brick"){cnt=Math.ceil(area/(0.114*0.065)*(1+P.loss));cu="块"}else{cnt=Math.ceil(area/(1.0*0.6)*(1+P.loss));cu="张"}
    bom.push({pk,P,t,layer:i,vol,w,cost,cnt,cu});mat+=cost;tons+=w});
  const brickVol=bom.filter(b=>b.P.form==="brick").reduce((s,b)=>s+b.vol,0);
  if(brickVol>0){const P=PRODUCTS.NJ;const w=brickVol*0.12;bom.push({pk:"NJ",P,t:0,layer:-1,vol:w/P.rho,w,cost:w*P.price,cnt:Math.ceil(w*40),cu:"袋(25kg)"});mat+=w*P.price;tons+=w}
  const checks=[];
  const hot=PRODUCTS[layers[0][0]];
  checks.push({k:"margin",ok:hot.cls-REQ.tMax>=REQ.margin,txt:`工作层分类温度 ${hot.cls}℃，相对最高温度 ${REQ.tMax}℃ 余量 ${hot.cls-REQ.tMax}℃（要求 ≥ ${REQ.margin}℃）`});
  layers.forEach(([pk],i)=>{if(i===0)return;const P=PRODUCTS[pk];const Ti=rMax.temps[i];checks.push({k:"iface"+i,ok:Ti<=P.cls-50,txt:`${P.code} 热面温度 ${fmt(Ti)}℃（最高工况），分类温度 ${P.cls}℃`})});
  checks.push({k:"outer",ok:r.Ts<=REQ.tOuter,txt:`外壁温度 ${fmt(r.Ts,1)}℃（要求 ≤ ${REQ.tOuter}℃）`});
  checks.push({k:"thick",ok:total<=REQ.maxThick,txt:`总厚度 ${total} mm（限值 ${REQ.maxThick} mm）`});
  return{r,rMax,total,bom,mat,tons,area,checks}}
function quote(ev){

  const freight=ev.tons*e.freight;const install=e.install?ev.area*e.installPrice:0;
  const net=matNet+freight+install;const tax=net*0.13;const total=net+tax;
  const costLine=list*0.80; // 示例：材料成本线 = 标价 × 80%
  return{list,disc,matNet,freight,install,net,tax,total,belowCost:matNet<costLine,costLine}}

function wallSvg(ev,layers){
  const W=520,H=230,x0=60,x1=W-30,y0=44,y1=H-36;const total=ev.total;const sc=(x1-x0)/Math.max(total,1);
  const Tmax=REQ.tNormal,yT=t=>y1-(t-0)/(Tmax)*(y1-y0);
  let x=x0,rects="",labels="";
  layers.forEach(([pk,t],i)=>{const P=PRODUCTS[pk];const w=t*sc;rects+=`<rect x="${x}" y="${y0}" width="${w}" height="${y1-y0}" fill="${P.color}" opacity=".55"/>`;
    labels+=`<text x="${x+w/2}" y="${y1+14}" text-anchor="middle" font-size="10" fill="var(--muted)">${P.code.replace("LN-","")} ${t}</text>`;x+=w});
  let pts=[],xx=x0;ev.r.temps.forEach((T,i)=>{pts.push(`${xx},${yT(T)}`);if(i<layers.length)xx+=layers[i][1]*sc});
  const temps=ev.r.temps.map((T,i)=>{let px=x0;for(let j=0;j<i;j++)px+=layers[j][1]*sc;const anchor=i===0?"start":(i===ev.r.temps.length-1?"end":"middle");return `<circle cx="${px}" cy="${yT(T)}" r="3" fill="var(--heat)"/><text x="${px+(i===0?5:0)}" y="${yT(T)-8}" text-anchor="${anchor}" font-size="11" font-family="JetBrains Mono,monospace" fill="var(--fg)">${fmt(T)}℃</text>`}).join("");
  const ticks=[0,400,800,1200].map(t=>`<line x1="${x0}" x2="${x1}" y1="${yT(t)}" y2="${yT(t)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${x0-6}" y="${yT(t)+3}" text-anchor="end" font-size="10" fill="var(--muted)">${t}</text>`).join("");
  return `<svg class="wall" viewBox="0 0 ${W} ${H}" role="img" aria-label="衬里温度分布">${ticks}${rects}
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--heat)" stroke-width="2"/>${temps}${labels}
    <text x="${x0}" y="12" font-size="10" fill="var(--muted)">窑内 ${REQ.tNormal}℃ →</text><text x="${x1}" y="12" text-anchor="end" font-size="10" fill="var(--muted)">→ 外壁 / 环境 ${REQ.tAmb}℃</text>
    <text x="${(x0+x1)/2}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--muted)">厚度 mm（总 ${total}）</text></svg>`}

function stdCurve(x){ // 位置 m → 标准温度 ℃（示例烧成曲线）
  if(x<=20)return 40+x/20*560; if(x<=30)return 600+(x-20)/10*500; if(x<=42)return 1100+Math.min((x-30)/4,1)*180; if(x<=50)return 1280-(x-42)/8*680; return 600-(x-50)/10*480}
function actual(x){let d=Math.sin(x*1.7)*3+Math.cos(x*.6)*2.5;if(x>=33&&x<=39)d+=30*Math.sin((x-33)/6*Math.PI);return stdCurve(x)+d}
const DEV_X=(()=>{let bx=33,bd=-1e9;for(let x=33;x<=39;x+=0.25){const d=actual(x)-stdCurve(x);if(d>bd){bd=d;bx=x}}return bx})();
function kilnChart(){
  const W=760,H=280,x0=48,x1=W-16,y0=16,y1=H-34;const X=x=>x0+x/60*(x1-x0),Y=t=>y1-t/1400*(y1-y0);
  let band="",std="",act="";const xs=[];for(let x=0;x<=60;x+=0.5)xs.push(x);
  band=xs.map(x=>`${X(x)},${Y(stdCurve(x)+15)}`).join(" ")+" "+xs.slice().reverse().map(x=>`${X(x)},${Y(stdCurve(x)-15)}`).join(" ");
  std=xs.map(x=>`${X(x)},${Y(stdCurve(x))}`).join(" ");act=xs.map(x=>`${X(x)},${Y(actual(x))}`).join(" ");
  const grid=[0,400,800,1200].map(t=>`<line x1="${x0}" x2="${x1}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${x0-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`).join("")+
    [0,10,20,30,40,50,60].map(x=>`<text x="${X(x)}" y="${y1+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${x}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="1# 隧道窑温度曲线">${grid}
   <rect x="${X(33)}" y="${y0}" width="${X(39)-X(33)}" height="${y1-y0}" fill="var(--heat-soft)"/>
   <polygon points="${band}" fill="var(--accent-soft)"/><polyline points="${std}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>
   <polyline points="${act}" fill="none" stroke="var(--heat)" stroke-width="2"/>
   <circle cx="${X(DEV_X)}" cy="${Y(actual(DEV_X))}" r="4" fill="var(--heat)"/><text x="${X(DEV_X)+8}" y="${Y(actual(DEV_X))-6}" font-size="12" fill="var(--heat)" font-family="JetBrains Mono,monospace">${fmt(actual(DEV_X))}℃</text>
   <text x="${x1}" y="${H-2}" text-anchor="end" font-size="11" fill="var(--muted)">窑车位置 m</text><text x="${x0}" y="${y0-4}" font-size="11" fill="var(--muted)">℃</text>
   <g font-size="11" fill="var(--muted)"><line x1="${x0+8}" x2="${x0+30}" y1="${y0+10}" y2="${y0+10}" stroke="var(--heat)" stroke-width="2"/><text x="${x0+34}" y="${y0+14}">实测</text>
   <line x1="${x0+70}" x2="${x0+92}" y1="${y0+10}" y2="${y0+10}" stroke="var(--accent)" stroke-dasharray="5 4"/><text x="${x0+96}" y="${y0+14}">标准曲线 ±15℃</text></g></svg>${devChart()}`}
function devChart(){
  const W=760,H=150,x0=48,x1=W-16,y0=22,y1=H-26;const X=x=>x0+x/60*(x1-x0),Y=d=>y0+(40-d)/80*(y1-y0);
  const xs=[];for(let x=0;x<=60;x+=0.5)xs.push(x);
  const area=`${X(0)},${Y(0)} `+xs.map(x=>`${X(x)},${Y(actual(x)-stdCurve(x))}`).join(" ")+` ${X(60)},${Y(0)}`;
  const grid=[-40,-15,0,15,40].map(d=>`<line x1="${x0}" x2="${x1}" y1="${Y(d)}" y2="${Y(d)}" stroke="var(--line)" ${d===15||d===-15?'stroke-dasharray="4 3"':""}/><text x="${x0-6}" y="${Y(d)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${d>0?"+":""}${d}</text>`).join("");

/* ---------------- 路由与事件 ---------------- */
const VIEWS={overview:vOverview,eng:vEng,tender:vTender,kiln:vKiln,kb:vKb};
function render(){
  const v=VIEWS[S.view]?S.view:"overview";
  const keep=document.activeElement&&document.activeElement.id;const selStart=document.activeElement&&document.activeElement.selectionStart;
  const ims=$("#imbody")?$("#imbody").scrollTop:null, dvs=$("#docview")?$("#docview").scrollTop:null;
  $("#view").innerHTML=VIEWS[v]();
  document.querySelectorAll(".navbtn").forEach(b=>b.setAttribute("aria-current",b.dataset.go===v?"page":"false"));
  if(keep){const el=document.getElementById(keep);if(el&&el.tagName==="INPUT"){el.focus();try{if(selStart!=null&&el.type!=="range"&&el.type!=="number"&&el.type!=="checkbox")el.setSelectionRange(selStart,selStart)}catch(_){}}}
  const ib=$("#imbody");if(ib)ib.scrollTop=ims==null?ib.scrollHeight:Math.max(ims,ib.scrollHeight);
  const dv=$("#docview");if(dv&&dvs!=null)dv.scrollTop=dvs;
  if(S.eng.hot){const m=document.querySelector(`#docview mark[data-f="${S.eng.hot}"]`);if(m)m.classList.add("hot")}
  document.querySelectorAll("#docview mark.src").forEach(m=>{if(S.eng.step===1&&!m.classList.contains("hot"))m.classList.add("seen")});
  S._newEv=false}
function route(){const h=location.hash.replace("#","");S.view=VIEWS[h]?h:"overview";render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);

document.addEventListener("click",ev=>{
  const g=ev.target.closest("[data-go]");if(g){$("#layer").innerHTML="";go(g.dataset.go);return}
  const a=ev.target.closest("[data-act]");if(!a)return;

  switch(act){
   case "reset":S=initialState();S.eng.layers=OPTIONS[0].layers.map(l=>l.slice());route();toast("已重置演示数据");break;

     setTimeout(()=>imPush({bot:true,html:`<span class="typing">Xiaomi-OCR-0 识别中…</span>`}),200);

     imPush({who:"王师傅",role:"仓管",me:true,html:"确认"});
     addEvent("仓管员","入库 矾土熟料 88# 32.46t，批号 KF-1031（送货单照片为证）","warehouse.received");
     addEvent("质检员","已为 KF-1031 生成来料检验任务：Al₂O₃、Fe₂O₃、体积密度","quality.task_created");
     addEvent("采购员","PO-0371 超量 2.46t，已起草与供应商的结算说明","purchase.over_receipt_flagged");
     setTimeout(()=>imPush({bot:true,html:`已入库，事件已记账。<br>· 质检员已生成来料检验任务（@质检 小陈）<br>· 超量 2.46 t 已交给采购员处理`}),400);break;
   case "im-edit":toast("演示：会打开字段修改卡片，修改后再确认");break;
   case "ask":ask(a.dataset.q);break;
   case "approve":{const it=S.inbox.find(i=>i.id===a.dataset.id);it.done=true;addEvent("你（总经理）","批准 "+it.t,"policy.approved");render();toast("已批准，采购员会把采购单发给供应商");break}
   case "step":{const n=+v;if(n>0&&e.parsed<DOC_PAGES.length)break;e.step=n;render();window.scrollTo({top:0});break}
   case "parse":startParse();break;
   case "cite":cite(a.dataset.f,+a.dataset.p);break;
   case "opt":e.opt=v;e.layers=OPTIONS.find(o=>o.id===v).layers.map(l=>l.slice());render();break;
   case "risk":if(v)e.risks[a.dataset.id]=v;else delete e.risks[a.dataset.id];render();break;
   case "submit":e.submitted=true;addEvent("工程师助理","EP-2026-031 方案与报价已提交，等待销售负责人确认（L2）","eng.review_submitted");render();
     modal(`<h2>已提交给销售负责人</h2><p>销售负责人会在钉钉收到审批卡片：方案摘要、报价合计、未关闭风险。确认后才会生成正式文件发给客户。</p><p class="small muted">这是演示：数据为模拟识别结果，按规则不能生成正式文件。</p><div class="row"><button class="btn pri" data-act="close">知道了</button><button class="btn" data-go="overview" data-act="close">回总览看事件账本</button></div>`);break;
   case "close":$("#layer").innerHTML="";break;
   case "tf":S.tenderFilter=v;render();break;
   case "tender2eng":S.tenderSent=true;addEvent("工程师助理","从 GT-ZB-2026-0815 技术规格书创建工程项目 EP-2026-032（工况 9 项、工程量 4 项）","eng.project_created");render();toast("已创建工程项目 EP-2026-032，工况和工程量已带入");break;
   case "kiln":S.kiln=v;render();break;
   case "kilnok":{const it=S.inbox.find(i=>i.id==="i2");it.done=true;addEvent("班长 赵师傅","确认执行：B7 空燃比下调 3%","kiln.action_confirmed");addEvent("质检员","为 #1031-14～17 添加加热永久线变化加检","quality.task_created");render();break}
   case "kilnno":toast("演示：会要求填写不采纳原因，作为 Agent 下次判断的依据");break;
   case "kb":S.kbProposal=v;if(v==="ok")addEvent("张工","确认 AI 提议：LN-ML26 导热系数更新（JC-2026-1022 p.2）","kb.change_approved");render();break;
  }
});
document.addEventListener("click",ev=>{if(ev.target.classList&&ev.target.classList.contains("modal-bg"))$("#layer").innerHTML=""});
function modal(html){$("#layer").innerHTML=`<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}

document.addEventListener("input",ev=>{
  const t=ev.target,e=S.eng;
  if(t.dataset.thick!==undefined){e.layers[+t.dataset.thick][1]=+t.value;t.nextElementSibling.textContent=t.value+" mm";

});
