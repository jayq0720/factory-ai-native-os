[project]
name = "fos"
version = "0.1.0"
description = "Factory AI Native OS: core services (Python)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "websockets>=13",    # 钉钉 Stream 长连接
  # 文档解析（许可证均可商用；不用 AGPL 的 PyMuPDF）
  "pypdfium2>=4.30",   # Apache-2.0 / BSD-3
  "pillow>=10.4",      # MIT-CMU (HPND)
  "python-docx>=1.1",  # MIT
  "openpyxl>=3.1",     # MIT
  "aiosqlite>=0.20",   # 本地试用（SQLite）；正式环境用 PostgreSQL
  "ortools>=9.10",     # Apache-2.0；排窑求解（CP-SAT）
  "cryptography>=42",  # Apache-2.0 / BSD；fos-edge 命令 Ed25519 签名
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
fos = "fos.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fos"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 中文全角标点

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
