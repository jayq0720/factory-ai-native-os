# 工业陶瓷行业 EHS 安全环保默认配置
env_limits:
  dust: {name: 颗粒物/粉尘, unit: mg/m³, max: 15.0}
  nox: {name: 氮氧化物 NOx, unit: mg/m³, max: 120.0}
  so2: {name: 二氧化硫 SO2, unit: mg/m³, max: 40.0}
  noise: {name: 厂界噪声, unit: dB(A), max: 82.0}
  voc: {name: 挥发性有机物 VOC, unit: mg/m³, max: 50.0}

auto_hazard_on_env_exceed: true
hazard_remind_days: 3
max_permit_hours: 48
notify_roles: [admin, gm]
