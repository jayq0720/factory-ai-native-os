# 招标 / 询价文件关键信息（方案 4.3 第 2、3 步）。★/▲ 实质性条款与废标条款逐条列出并带页码。
id: tender
name: 招标文件关键信息
version: 1
kinds: [tender]
fields:
  # ---------- 项目概况 ----------
  - {key: project_name, name: 项目名称, group: 项目概况, labels: [招标项目名称, 采购项目名称, 项目名称, 工程名称], required: true}
  - {key: tender_no, name: 招标编号, group: 项目概况, labels: [招标编号, 项目编号, 采购编号, 招标文件编号, 标段编号], required: true}
  - {key: purchaser, name: 招标人, group: 项目概况, labels: [招标人, 采购人, 建设单位, 业主]}
  - {key: agency, name: 招标代理机构, group: 项目概况, labels: [招标代理机构, 采购代理机构, 代理机构]}
  - {key: budget, name: 预算/最高限价, group: 项目概况, type: money, labels: [最高投标限价, 招标控制价, 最高限价, 控制价, 预算金额, 采购预算]}
  - {key: delivery_period, name: 交货期/工期, group: 项目概况, labels: [交货期, 工期, 供货期, 服务期]}
  - {key: delivery_place, name: 交货地点, group: 项目概况, labels: [交货地点, 项目地点, 建设地点, 实施地点]}

  # ---------- 时间节点 ----------
  - {key: bid_deadline, name: 投标截止时间, group: 时间节点, type: date, labels: [投标截止时间, 投标文件递交截止时间, 响应文件提交截止时间, 递交截止时间, 截止时间], exclude_before: [澄清, 质疑, 答疑], required: true}
  - {key: opening_time, name: 开标时间, group: 时间节点, type: date, labels: [开标时间, 开启时间]}
  - {key: clarification_deadline, name: 澄清截止时间, group: 时间节点, type: date, labels: [澄清截止时间, 质疑截止时间, 答疑截止时间]}

  # ---------- 投标要求 ----------
  - {key: bid_bond, name: 投标保证金, group: 投标要求, type: money, labels: [投标保证金, 保证金]}
  - {key: qualification, name: 资格要求, group: 投标要求, labels: [投标人资格要求, 资格要求, 供应商资格, 资质要求]}
  - key: evaluation_method
    name: 评标办法
    group: 投标要求
    type: enum
    labels: [评标办法, 评标方法, 评审方法]
    enum: [综合评分法, 最低评标价法, 经评审的最低投标价法, 合理低价法]
    scan_all: true
  - {key: payment_terms, name: 付款方式, group: 投标要求, labels: [付款方式, 支付方式, 付款条件]}
  - {key: warranty, name: 质保期, group: 投标要求, labels: [质保期, 保修期, 质量保证期]}

  # ---------- 联系方式 ----------
  - {key: contact, name: 联系人, group: 联系方式, labels: [联系人]}
  - {key: phone, name: 联系电话, group: 联系方式, labels: [联系电话, 电话], patterns: ['(?:0\d{2,3}-?\d{7,8}|1[3-9]\d{9})']}

  # ---------- 条款 ----------
  - key: starred_clauses
    name: ★▲实质性条款
    group: 条款
    type: list
    patterns: ['^\s*[★▲].{4,}', '(?:必须|不得|不允许).{4,}']
    description: 带★/▲标记或"必须""不得"的条款，不响应可能导致废标
  - key: disqualify_clauses
    name: 废标/否决条款
    group: 条款
    type: list
    patterns: ['.{0,60}(?:废标|无效投标|否决其投标|投标无效|不予受理).{0,60}']
