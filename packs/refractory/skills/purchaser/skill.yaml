model: fos-chat
autonomy: L2
tools: [stock.query, purchase.suggestions, purchase.compare, purchase.supplier_scores, objects.get, objects.list,
        ledger.propose]
permissions: ["warehouse.*:read", "purchase.*:read", "pmc.kiln_plan:read"]
proposes: [purchase.requisition_raised]
max_steps: 6
