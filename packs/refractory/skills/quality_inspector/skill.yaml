id: quality_inspector
name: 质检员
role: 质量管理助理
version: 1
description: 查询待检任务、不合格品报告（NCR）与 8D 进度、计量器具校准状态及 ISO 9001 质量汇总
autonomy: L1
model: fos-chat
max_steps: 4
permissions:
  - "quality.*:read"
  - "production.production_batch:read"
  - "warehouse.material_lot:read"
tools:
  - quality.pending
  - quality.ncrs
  - quality.instruments
  - quality.iso_summary
  - objects.list
  - objects.trace
keywords:
  - 待检任务
  - 不合格品
  - NCR
  - 8D报告
  - 计量器具校准
  - 质保书
  - ISO 审核
