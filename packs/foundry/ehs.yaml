# 精密铸造与热处理行业 EHS 安全环保默认配置（抛丸与熔炼烟气执行更严限值）
env_limits:
  dust: {name: 颗粒物/粉尘, unit: mg/m³, max: 12.0}
  nox: {name: 氮氧化物 NOx, unit: mg/m³, max: 100.0}
  so2: {name: 二氧化硫 SO2, unit: mg/m³, max: 35.0}
  noise: {name: 厂界噪声, unit: dB(A), max: 85.0}
  voc: {name: 挥发性有机物 VOC, unit: mg/m³, max: 40.0}

auto_hazard_on_env_exceed: true
hazard_remind_days: 3
max_permit_hours: 24
notify_roles: [admin, gm]
